<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bunviko · lançamento (16:9) v2</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--amarelo:#FFCF35;--amarelo-e:#E3AD12;--laranja:#EF7130;--laranja-e:#C9561C;--vermelho:#CE3B25;
        --marrom:#32231C;--creme:#FDF8EF;--viko:#FDEEDB;--ok:#2FB65A;--ok-e:#22914A;--suave:#8A7466;--linha:#F1E4D2;
        --sans:'Nunito',Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  .stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--amarelo);
         font-family:var(--sans);color:var(--marrom);transform-origin:center}
  .abs{position:absolute}
  .fill{position:absolute;inset:0}
  .scene{position:absolute;inset:0;visibility:hidden}
  .cam{position:absolute;inset:0;transform-origin:50% 50%}
  .bg{position:absolute;inset:-60px}
  .mask{display:block;overflow:hidden;padding:.08em 0 .14em;margin:-.08em 0 -.14em}
  .mask>span{display:block}
  .big{font-weight:1000;letter-spacing:-.04em;line-height:.9}
  .lbl{font-weight:900;font-size:32px;letter-spacing:.24em;text-transform:uppercase}
  .lj{color:var(--laranja)}
  svg{overflow:visible}
  .vk{position:absolute}

  #bgL{position:absolute;inset:0;z-index:0}
  #bgL .fl{position:absolute;inset:0}
  .blob{position:absolute;pointer-events:none;z-index:1}
  #fx{position:absolute;inset:0;z-index:45;pointer-events:none}
  .onda{position:absolute;border-radius:50%;border:10px solid var(--laranja);opacity:0}

  /* 1. gancho */
  #s1 .bg{background:var(--amarelo)}
  #s1 .lbl{left:150px;top:300px}
  #s1 .hook{left:140px;top:350px;font-size:250px}
  #s1 .hook .w{display:inline-block;transform-origin:50% 100%}
  #vk1{left:1130px;top:330px;width:620px}
  #dedo1{left:795px;top:1100px;width:170px}
  .faisca{position:absolute;width:150px;height:150px}

  /* 2. salão */
  #s2 .bg{background:var(--creme)}
  #s2 .rodape{left:-60px;right:-60px;top:640px;height:500px;background:#F6ECDD}
  #s2 .chao{left:-60px;right:-60px;top:900px;height:240px;background:#EFE1CC}
  #s2 .acen{left:0;right:0;top:120px;text-align:center;font-size:210px;z-index:3}
  #s2 .acen .l{display:inline-block;transform-origin:50% 80%}
  .lamp{position:absolute;top:-10px;width:140px;height:220px;transform-origin:50% 0}
  .mesa{position:absolute;width:300px;height:420px}
  .mao{position:absolute;width:112px;height:140px;transform-origin:50% 95%}
  .balao{position:absolute;padding:14px 26px;background:#fff;border-radius:30px;font-weight:1000;font-size:40px;
         box-shadow:0 8px 0 #E2CDB3;white-space:nowrap;transform-origin:30% 100%}
  .balao::after{content:"";position:absolute;left:28px;bottom:-14px;width:28px;height:28px;background:#fff;transform:rotate(45deg);border-radius:4px}
  #garcom{left:0;top:470px;width:190px;z-index:2}
  #vk2{left:70px;top:700px;width:230px;z-index:4}
  #apMesa{left:860px;top:608px;width:240px;z-index:4}

  /* 3. virada */
  #s3 .com{left:150px;top:330px}
  #s3 .nome{left:140px;top:390px;font-size:200px}
  #ap3{left:1010px;top:220px;width:840px}

  /* 4. toque + celular */
  #s4 .cam{transform-origin:0 0}
  #ap4{left:540px;top:200px;width:840px}
  #dedo4{width:170px}
  #cel{left:1380px;top:150px;width:390px}
  #s4 .hora{left:140px;top:80px;font-size:170px}
  #s4 .sinal{left:0;top:0;width:1920px;height:1080px}
  .vib{position:absolute;width:60px;height:120px}

  /* morfose alerta -> cartão */
  #morph{position:absolute;z-index:44;visibility:hidden;border-radius:34px;background:var(--laranja)}

  /* 5. rastreio */
  #s5 .lbl{left:150px;top:170px}
  #s5 .tit{left:140px;top:220px;font-size:150px}
  #card{left:150px;top:520px;width:1120px;height:340px;background:#fff;border-radius:48px;
        box-shadow:0 14px 0 var(--linha);padding:40px 56px}
  .card-topo{display:flex;justify-content:space-between;font-weight:1000;font-size:34px}
  .card-topo span{color:var(--suave);font-weight:800}
  .passos{position:absolute;left:56px;right:56px;top:120px;display:grid;grid-template-columns:repeat(4,1fr)}
  .passo{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
  .passo .no{position:relative;z-index:2;width:120px;height:120px;border-radius:50%;background:var(--linha);
             box-shadow:0 8px 0 #E2CDB3;display:grid;place-items:center;color:var(--suave)}
  .passo .no svg{position:absolute;width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .passo .no .ck{stroke:#fff;stroke-width:3.2}
  .passo b{font-size:30px;font-weight:1000;color:var(--suave)}
  .liga{position:absolute;top:52px;left:50%;width:100%;height:16px;border-radius:99px;background:var(--linha);z-index:1}
  .liga i{display:block;height:100%;border-radius:99px;background:var(--ok);transform:scaleX(0);transform-origin:0 50%}
  .anel{position:absolute;inset:-14px;border-radius:50%;border:9px solid var(--laranja);opacity:0}
  #vk5{left:1340px;top:380px;width:470px}

  /* 6. marca */
  #vk6{left:170px;top:250px;width:620px}
  #logo6{left:800px;top:370px;font-size:230px}
  #s6 .slog1{left:810px;top:690px;font-size:92px}
  #s6 .slog2{left:1300px;top:690px;font-size:92px}
  .logo{display:flex;align-items:flex-start}
  .logo .l{display:inline-block;transform-origin:50% 100%}
  .logo .fa{width:.5em;height:.5em;margin-left:.02em;margin-top:-.2em}

  /* 7. chamada */
  #logo7{left:0;right:0;top:170px;justify-content:center;font-size:170px;color:#fff}
  #s7 .lbl{left:0;right:0;top:470px;text-align:center;color:var(--amarelo)}
  #pill{left:50%;top:560px;width:1060px;height:190px;margin-left:-530px;background:#fff;border-radius:999px;
        display:flex;align-items:center;gap:30px;padding:0 30px 0 44px;box-shadow:0 14px 0 #00000040}
  #pill .ig{width:110px;height:110px;flex:none}
  #pill .at{font-size:76px;font-weight:1000;letter-spacing:-.02em;flex:1}
  #seguir{position:relative;width:320px;height:118px;border-radius:999px;background:var(--laranja);color:#fff;
          font-size:46px;font-weight:1000;display:grid;place-items:center;box-shadow:0 10px 0 var(--laranja-e)}
  #seguir span{position:absolute;display:flex;align-items:center;gap:10px}
  #vk7{left:110px;top:740px;width:300px}
  #mao7{left:360px;top:760px;width:100px;height:125px}
  #dedo7{width:150px}

  #s1{z-index:10} #s2{z-index:11} #s3{z-index:12} #s4{z-index:13} #s5{z-index:14} #s6{z-index:15} #s7{z-index:16}

  .grain{position:absolute;inset:-128px;opacity:.06;mix-blend-mode:overlay;pointer-events:none;z-index:60}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:59;background:radial-gradient(ellipse at center,transparent 65%,#32231C26 100%)}

  .start{position:fixed;inset:0;margin:auto;width:360px;height:80px;border:0;border-radius:40px;background:var(--laranja);color:#fff;
         font:1000 26px var(--sans);letter-spacing:.04em;cursor:pointer;z-index:100;box-shadow:0 10px 40px #0006}
  .rendering .start,.started .start{display:none}
  .ctrl{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;font:700 12px var(--sans);color:#fff9;background:linear-gradient(transparent,#000c);
        display:flex;gap:16px;align-items:center;opacity:0;transition:opacity .3s}
  .ctrl.on{opacity:1}
  .ctrl .bar{flex:1;height:4px;background:#ffffff22;cursor:pointer}
  .ctrl .bar i{display:block;height:100%;width:0;background:var(--laranja)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="bgL"></div>
  <div class="blob" id="blobA" style="left:1500px;top:-260px;width:620px;height:540px;background:var(--laranja);border-radius:46% 54% 60% 40%"></div>
  <div class="blob" id="blobB" style="left:-200px;top:820px;width:520px;height:420px;background:var(--vermelho);border-radius:58% 42% 40% 60%"></div>

  <!-- 1. GANCHO -->
  <section class="scene" id="s1"><div class="cam" id="cam1">
    <div class="bg"></div>
    <div class="abs lbl"><span class="mask"><span>Já imaginou?</span></span></div>
    <div class="abs big hook"><span class="w">um</span> <span class="w lj" id="toque">toque</span></div>
    <div class="vk" id="vk1"></div>
    <div class="faisca" id="fa1" style="left:1050px;top:270px"></div>
    <div class="abs" id="dedo1"></div>
  </div></section>

  <!-- 2. SALÃO -->
  <section class="scene" id="s2"><div class="cam" id="cam2">
    <div class="bg"></div>
    <div class="abs rodape"></div>
    <div class="abs chao"></div>
    <div id="lamps"></div>
    <div id="fundo"></div>
    <div class="abs" id="garcom"></div>
    <div id="salao"></div>
    <div class="abs big acen" id="acen"></div>
    <div id="baloes"></div>
    <div class="abs" id="apMesa"></div>
    <div class="vk" id="vk2"></div>
  </div></section>

  <!-- 3. VIRADA -->
  <section class="scene" id="s3"><div class="cam" id="cam3">
    <div class="abs lbl com"><span class="mask"><span>Com o</span></span></div>
    <div class="abs big nome logo" id="nome3"></div>
    <div class="abs" id="ap3"></div>
  </div></section>

  <!-- 4. TOQUE + CELULAR -->
  <section class="scene" id="s4"><div class="cam" id="cam4">
    <div class="abs" id="ap4"></div>
    <svg class="abs sinal" viewBox="0 0 1920 1080">
      <path id="sinal" d="M540 380 C760 200 1180 160 1470 300" fill="none" stroke="#EF7130" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
      <circle id="ponto" r="20" fill="#fff" stroke="#EF7130" stroke-width="10" cx="-100" cy="-100"/>
    </svg>
    <div class="abs" id="cel"></div>
    <svg class="vib" id="vibE" style="left:1330px;top:420px" viewBox="0 0 60 120"><path d="M40 20 Q20 60 40 100 M20 35 Q5 60 20 85" fill="none" stroke="#32231C" stroke-width="8" stroke-linecap="round"/></svg>
    <svg class="vib" id="vibD" style="left:1790px;top:420px" viewBox="0 0 60 120"><path d="M20 20 Q40 60 20 100 M40 35 Q55 60 40 85" fill="none" stroke="#32231C" stroke-width="8" stroke-linecap="round"/></svg>
    <div class="abs big hora"><span class="mask"><span>na <span class="lj">hora</span></span></span></div>
    <div class="abs" id="dedo4"></div>
    <div class="faisca" id="fa4" style="left:885px;top:110px"></div>
  </div></section>

  <!-- 5. RASTREIO -->
  <section class="scene" id="s5"><div class="cam" id="cam5">
    <div class="abs lbl"><span class="mask"><span>O cliente acompanha</span></span></div>
    <div class="abs big tit"><span class="mask"><span>o <span class="lj">pedido</span></span></span></div>
    <div class="abs" id="card">
      <div class="card-topo"><b>Seu pedido</b><span>Mesa 3</span></div>
      <div class="passos" id="passos"></div>
    </div>
    <div class="vk" id="vk5"></div>
  </div></section>

  <!-- 6. MARCA -->
  <section class="scene" id="s6"><div class="cam" id="cam6">
    <div class="vk" id="vk6"></div>
    <div class="abs big logo" id="logo6"></div>
    <div class="abs big slog1"><span class="mask"><span>Um toque.</span></span></div>
    <div class="abs big slog2"><span class="mask"><span class="lj">Seu sabor.</span></span></div>
  </div></section>

  <!-- 7. CHAMADA -->
  <section class="scene" id="s7"><div class="cam" id="cam7">
    <div class="abs big logo" id="logo7"></div>
    <div class="abs lbl"><span class="mask"><span>Vem conhecer no nosso Instagram</span></span></div>
    <div class="abs" id="pill">
      <svg class="ig" viewBox="0 0 110 110"><rect x="8" y="8" width="94" height="94" rx="30" fill="none" stroke="#32231C" stroke-width="9"/><circle cx="55" cy="55" r="22" fill="none" stroke="#32231C" stroke-width="9"/><circle cx="80" cy="30" r="6" fill="#32231C"/></svg>
      <div class="at" id="arroba"></div>
      <div id="seguir"><span id="sg1">Seguir</span><span id="sg2" style="opacity:0">Seguindo
        <svg viewBox="0 0 24 24" width="44" height="44"><path id="sgck" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#32231C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></span></div>
    </div>
    <div class="vk" id="vk7"></div>
    <svg class="abs mao" id="mao7" viewBox="0 0 80 100"></svg>
    <div class="abs" id="dedo7"></div>
  </div></section>

  <div id="morph"></div>
  <div id="fx"></div>
  <div class="vignette"></div>
  <div class="grain" id="grain"></div>
</div>

<button class="start" id="start">▶ ASSISTIR</button>
<div class="ctrl" id="ctrl"><span id="ctrlTime">00.0s</span><div class="bar" id="ctrlBar"><i></i></div><span>ESPAÇO play/pause · ←/→ 2s · R reinicia</span></div>

<script src="vendor/gsap.min.js"></script>
<script>
// ================= configuração =================
const INSTAGRAM = '@bunviko';          // ← PROVISÓRIO: trocar pelo @ oficial
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const W = 1920, H = 1080, DURATION = 26;
const C = { amarelo: '#FFCF35', laranja: '#EF7130', vermelho: '#CE3B25', marrom: '#32231C', creme: '#FDF8EF', ok: '#2FB65A' };

const stage = $('#stage');
const fit = () => stage.style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth/W, innerHeight/H)})`;
fit(); addEventListener('resize', fit);

// ================= ativos em vetor =================
const ESC = '#32231C';
const ln = (d, w = 12, c = ESC) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const OLHOS = {
  setas: ln('M88 92 L64 110 L88 128') + ln('M132 92 L156 110 L132 128'),
  bolinhas: `<ellipse cx="76" cy="110" rx="11" ry="13" fill="${ESC}"/><ellipse cx="144" cy="110" rx="11" ry="13" fill="${ESC}"/><circle cx="80" cy="105" r="4" fill="#fff"/><circle cx="148" cy="105" r="4" fill="#fff"/>`,
  arcos: ln('M62 116 Q76 96 90 116') + ln('M130 116 Q144 96 158 116'),
  coracoes: ['M76 124 C60 112 62 96 72 98 C75 98 76 101 76 101 C76 101 77 98 80 98 C90 96 92 112 76 124Z',
             'M144 124 C128 112 130 96 140 98 C143 98 144 101 144 101 C144 101 145 98 148 98 C158 96 160 112 144 124Z']
    .map(d => `<path d="${d}" fill="#CE3B25" stroke="#CE3B25" stroke-width="5" stroke-linejoin="round"/>`).join(''),
};
const BOCAS = {
  sorriso: ln('M98 136 Q110 152 122 136'),
  aberta: `<path d="M94 134 Q110 162 126 134 Z" fill="${ESC}" stroke="${ESC}" stroke-width="6" stroke-linejoin="round"/><path d="M101 147 Q110 140 119 147 Q110 156 101 147Z" fill="#F08A6C"/>`,
};
const HUMORES = { feliz: ['setas','sorriso'], animado: ['setas','aberta'], atento: ['bolinhas','sorriso'],
  concentrado: ['arcos','sorriso'], alegre: ['arcos','aberta'], apaixonado: ['coracoes','aberta'] };
const EXTRAS = {
  chapeu: `<g stroke="#E2CDB3" stroke-width="3"><rect x="80" y="30" width="60" height="20" rx="6" fill="#fff"/><circle cx="88" cy="18" r="16" fill="#fff"/><circle cx="132" cy="18" r="16" fill="#fff"/><circle cx="110" cy="8" r="20" fill="#fff"/><rect x="81.5" y="26" width="57" height="12" fill="#fff" stroke="none"/></g>`,
  sino: `<g transform="translate(176 128) rotate(14)"><path d="M-20 20 H20 C16 15 14 10 14 0 A14 14 0 0 0 -14 0 C-14 10 -16 15 -20 20Z" fill="#FFCF35" stroke="${ESC}" stroke-width="5" stroke-linejoin="round"/><circle cx="0" cy="26" r="5" fill="${ESC}"/><circle cx="0" cy="-17" r="4" fill="${ESC}"/></g>`,
  bloco: `<g transform="translate(178 132) rotate(10)"><rect x="-20" y="-24" width="40" height="48" rx="6" fill="#fff" stroke="${ESC}" stroke-width="5"/><path d="M-10 -10 H10 M-10 0 H10 M-10 10 H4" stroke="#EF7130" stroke-width="5" stroke-linecap="round"/></g>`,
  prato: `<g transform="translate(176 140)"><path d="M-26 6 A26 24 0 0 1 26 6 Z" fill="#FFCF35" stroke="${ESC}" stroke-width="5" stroke-linejoin="round"/><rect x="-32" y="6" width="64" height="8" rx="4" fill="#fff" stroke="${ESC}" stroke-width="5"/><circle cx="0" cy="-20" r="5" fill="${ESC}"/></g>`,
  brilhos: [[24,40,1],[196,70,.8],[30,150,.7]].map(([x,y,k]) => `<path transform="translate(${x} ${y}) scale(${k})" d="M0 -16 C3 -4 4 -3 16 0 C4 3 3 4 0 16 C-3 4 -4 3 -16 0 C-4 -3 -3 -4 0 -16Z" fill="#FFCF35" stroke="#EF7130" stroke-width="3" stroke-linejoin="round"/>`).join(''),
};
// Um Viko com várias "caras" empilhadas: trocar de expressão = mostrar outra camada
function vikoSVG(caras, attrs = '') {
  const camadas = caras.map(([h, e], i) => {
    const [o, b] = HUMORES[h];
    return `<g class="cara cara-${i}" style="opacity:${i ? 0 : 1}"><g class="olhos" style="transform-box:fill-box;transform-origin:center">${OLHOS[o]}</g>${BOCAS[b]}${e ? EXTRAS[e] : ''}</g>`;
  }).join('');
  return `<svg ${attrs} viewBox="0 -30 220 210" style="width:100%;height:auto;display:block;overflow:visible">
    <ellipse class="sombra" cx="110" cy="172" rx="78" ry="8" fill="${ESC}" opacity=".12" style="transform-box:fill-box;transform-origin:center"/>
    <g class="corpo" style="transform-box:fill-box;transform-origin:50% 100%">
      <path d="M110 18 C170 18 204 64 204 116 C204 158 172 168 110 168 C48 168 16 158 16 116 C16 64 50 18 110 18Z" fill="#FDEEDB"/>
      <path d="M22 134 C30 156 60 164 110 164 C160 164 190 156 198 134 C186 150 156 156 110 156 C64 156 34 150 22 134Z" fill="#F4DCC0"/>
      <g class="faiscas-vk">${ln('M164 14 L168 -4', 11, '#EF7130') + ln('M180 28 L194 14', 11, '#EF7130')}</g>
      <ellipse cx="52" cy="136" rx="13" ry="8" fill="#F7A98B" opacity=".55"/><ellipse cx="168" cy="136" rx="13" ry="8" fill="#F7A98B" opacity=".55"/>
      ${camadas}
    </g></svg>`;
}
const FAISCAS = (cor = '#EF7130') => `<svg viewBox="0 0 30 30" style="width:100%;height:100%;overflow:visible"><g stroke="${cor}" stroke-width="5" stroke-linecap="round">
  <path d="M8 13 L11 3"/><path d="M17 18 L26 10"/><path d="M19 26 L29 26"/></g></svg>`;
// mão de clique (estilo ícone de traço): indicador para cima, dedos ao lado, polegar na diagonal.
// .raios = os traços do "clique" que saem da ponta do dedo (laranja, como as faíscas da marca).
const DEDO = (rot = 0) => `<svg viewBox="0 0 120 160" style="width:100%;height:auto;transform:rotate(${rot}deg);overflow:visible">
  <g class="dedo-ponta" style="transform-box:fill-box;transform-origin:50% 100%"
     fill="#fff" stroke="#32231C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M34 82 V14 A8 8 0 0 1 50 14 V56 A7 7 0 0 1 64 56 V62 A7 7 0 0 1 78 62 V70 A7 7 0 0 1 92 70 V104
             Q92 116 86 124 V128 H40 V124 L14 94 A8.5 8.5 0 0 1 26 82 L34 92 Z"/>
    <path d="M50 58 V80 M64 62 V84 M78 70 V88" fill="none"/>
    <path d="M40 128 H86 V139 Q86 150 75 150 H51 Q40 150 40 139 Z"/>
  </g>
  <g class="raios" stroke="#EF7130" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M42 -12 V-26"/><path d="M27 -5 L17 -15"/><path d="M57 -5 L67 -15"/><path d="M20 8 H6"/><path d="M64 8 H78"/>
  </g></svg>`;
// mão aberta acenando, no mesmo traço da mão de clique
const MAO = `<g fill="#fff" stroke="#32231C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <path d="M22 62 V20 A6 6 0 0 1 34 20 V50 V12 A6 6 0 0 1 46 12 V50 V16 A6 6 0 0 1 58 16 V52 V26 A6 6 0 0 1 70 26 V66
           Q70 92 46 92 H38 Q24 92 16 80 L5 57 A6 6 0 0 1 16 51 L22 62 Z"/>
  <path d="M26 92 H64 V100 Q64 106 58 106 H32 Q26 106 26 100 Z"/></g>`;
function aparelho(id, ligado = true) {
  return `<svg viewBox="0 0 760 560" style="width:100%;height:auto;overflow:visible">
    <ellipse cx="380" cy="542" rx="330" ry="16" fill="#32231C" opacity=".16"/>
    <g id="${id}-btn" style="transform-box:fill-box;transform-origin:50% 100%">
      <rect x="300" y="26" width="160" height="50" rx="25" fill="#C9561C"/><rect x="300" y="20" width="160" height="44" rx="22" fill="#EF7130"/></g>

const M = {

const show = (s, t) => tl.set(s, { visibility: 'visible' }, t), hide = (s, t) => tl.set(s, { visibility: 'hidden' }, t);
const revealIn = (sel, t, o = {}) => (gsap.set(sel, { yPercent: 130 }), tl.fromTo(sel, { yPercent: 130 }, { yPercent: 0, ...M.IN, stagger: M.STAG, immediateRender: false, ...o }, t));

const slam = (sel, t, from = 1.7) => (gsap.set(sel, { opacity: 0 }), tl.fromTo(sel, { scale: from, opacity: 0, filter: 'blur(14px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .35, ease: 'expo.out', immediateRender: false }, t));
const push = (cam, t, d, a = 1, b = 1.035) => tl.fromTo(cam, { scale: a }, { scale: b, duration: d, ease: 'none', immediateRender: false }, t);
const clique = (dedo, t) => (gsap.set(`${dedo} .raios path`, { opacity: 0 }),
  tl.fromTo(`${dedo} .raios path`, { opacity: 0, scale: .3, svgOrigin: '42 6' }, { opacity: 1, scale: 1, svgOrigin: '42 6', duration: .28, ease: 'back.out(2.5)', stagger: .025, immediateRender: false }, t),
  tl.to(`${dedo} .raios path`, { opacity: 0, duration: .25, ease: 'power2.in' }, t + .55));
const faiscas = (el, t) => (gsap.set(`${el} path`, { scale: 0, opacity: 0, transformOrigin: '0% 100%' }),
  tl.fromTo(`${el} path`, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: 'back.out(3)', stagger: .07, immediateRender: false }, t));
// onda de choque: anel que cresce e afina a partir de um ponto (coordenadas do palco)
function onda(x, y, t, cor = C.laranja, r = 160, n = 2) {
  for (let k = 0; k < n; k++) {
    const el = document.createElement('div'); el.className = 'onda';
    el.style.cssText = `left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;border-color:${cor}`;
    $('#fx').appendChild(el);
    tl.fromTo(el, { scale: .15, opacity: .95, borderWidth: 18 }, { scale: 1, opacity: 0, borderWidth: 2, duration: .6, ease: 'expo.out', immediateRender: false }, t + k * .12);
  }
}

const piscar = (vk, t) => tl.to(`${vk} .olhos`, { scaleY: .1, duration: .07, yoyo: true, repeat: 1, ease: 'power1.inOut' }, t);
function pulo(vk, t, h = 60) {
  tl.to(`${vk} .corpo`, { scaleY: .86, scaleX: 1.1, duration: .12, ease: 'power2.out' }, t)
    .to(`${vk} .corpo`, { y: -h, scaleY: 1.1, scaleX: .93, duration: .22, ease: 'power2.out' }, t + .12)
    .to(`${vk} .sombra`, { scale: .7, opacity: .06, duration: .22, ease: 'power2.out' }, t + .12)
    .to(`${vk} .corpo`, { y: 0, scaleY: 1, scaleX: 1, duration: .2, ease: 'power2.in' }, t + .34)
    .to(`${vk} .sombra`, { scale: 1, opacity: .12, duration: .2, ease: 'power2.in' }, t + .34)
    .fromTo(`${vk} .corpo`, { scaleY: .88, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, ...M.SQ, immediateRender: false }, t + .54);
}
const respirar = (vk, t, d) => tl.fromTo(`${vk} .corpo`, { scaleY: 1, scaleX: 1 }, { scaleY: 1.025, scaleX: .99, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: Math.max(1, Math.floor(d / .9) - 1), immediateRender: false }, t);
let flN = 0;
function flood(color, t, x = 960, y = 540, d = .6, ease = 'power3.inOut') {

  return el;
}

gsap.set('#ap3', { x: -470, y: 10, scale: 960 / 840 });
tl.fromTo('#a3-flash', { opacity: 0, scaleY: 1, scaleX: .02 }, { opacity: 1, scaleX: 1, duration: .14, ease: 'power2.out', immediateRender: false }, S3 + .05)
  .to('#a3-flash', { scaleY: 70, opacity: 0, duration: .18, ease: 'power2.in' }, S3 + .19)
  .to('#a3-tela', { opacity: 1, duration: .1 }, S3 + .25);
const TV3 = S3 + .3;
flood(C.amarelo, TV3, 960, 560, .6, 'power3.out');
onda(960, 540, TV3, '#fff', 420, 1);
tl.fromTo(['#blobA', '#blobB'], { scale: 0 }, { scale: 1, duration: .8, ease: 'expo.out', immediateRender: false }, TV3 + .1);
tl.to('#ap3', { x: 0, y: 0, scale: 1, duration: .75, ease: 'expo.inOut' }, TV3 + .2);
revealIn('#s3 .com .mask>span', TV3 + .55);
// letras caem e quicam como gelatina
gsap.set('#nome3 .l', { y: -620, opacity: 0 }); gsap.set('#nome3 .fa', { opacity: 0 });
tl.to('#nome3 .l', { y: 0, opacity: 1, duration: .42, ease: 'power2.in', stagger: .06 }, TV3 + .5);
tl.fromTo('#nome3 .l', { scaleY: .72, scaleX: 1.2 }, { scaleY: 1, scaleX: 1, ...M.SQ, stagger: .06, immediateRender: false }, TV3 + .92);
tl.set('#nome3 .fa', { opacity: 1 }, TV3 + 1.4);
faiscas('#nome3 .fa', TV3 + 1.4);
push('#cam3', S3, S4 - S3 - .5);
// mergulho no botão
tl.to('#cam3', { scale: 2.4, x: -1128, y: 658, duration: .6, ease: 'power4.inOut' }, S4 - .5);
tl.to(['#s3 .com', '#nome3'], { opacity: 0, duration: .3 }, S4 - .5);
hide('#s3', S4 + .1); show('#s4', S4 + .1);

// ============ 4. TOQUE + CELULAR (9.8 – 13.6) ============
gsap.set('#cam4', { scale: 2.4, x: -1344, y: -50 });
tl.to('#cam4', { scale: 1, x: 0, y: 0, duration: .85, ease: 'power4.inOut' }, S4 + 1.0);
tl.set('#dedo4', { left: 850, top: -185, opacity: 1 }, S4);
tl.fromTo('#dedo4', { y: 0 }, { y: 180, duration: .35, ease: 'expo.out', immediateRender: false }, S4 + .12);
tl.to('#dedo4', { y: 222, duration: .1, ease: 'power2.in' }, S4 + .52);
tl.to('#dedo4 .dedo-ponta', { scaleY: .93, scaleX: 1.04, duration: .1, ease: 'power2.in', yoyo: true, repeat: 1 }, S4 + .52);
clique('#dedo4', S4 + .52 + .06);
tl.to('#a4-btn', { scaleY: .5, duration: .1, ease: 'power2.in' }, S4 + .52)
  .to('#a4-btn', { scaleY: 1, ...M.SQ }, S4 + .65);
tl.to('#dedo4', { y: -260, duration: .4, ease: 'power3.in' }, S4 + .8);
tl.set('#a4-tela1', { opacity: 0 }, S4 + .6).set('#a4-tela2', { opacity: 1 }, S4 + .6);
onda(960, 560, S4 + .62, C.laranja, 300);
faiscas('#fa4', S4 + .62);
tl.to('#ap4', { x: -420, y: 150, scale: .82, transformOrigin: '50% 0%', duration: .7, ease: 'power4.inOut' }, S4 + 1.3);
tl.to('#fa4', { x: -420, y: 150, scale: .82, duration: .7, ease: 'power4.inOut' }, S4 + 1.3);
// o celular entra girando em 3D
tl.fromTo('#cel', { x: 700, rotationY: -55, rotation: 10, transformPerspective: 1400 },
  { x: 0, rotationY: 0, rotation: 0, transformPerspective: 1400, duration: .85, ease: 'expo.out', immediateRender: false }, S4 + 1.5);
// o sinal: um ponto de luz viaja pela linha do botão até o celular
const sig = { p: 0 };
tl.to('#sinal', { opacity: .9, duration: .2 }, S4 + 1.95);
tl.set('#ponto', { opacity: 1 }, S4 + 1.95);
tl.fromTo(sig, { p: 0 }, { p: 1, duration: .55, ease: 'power2.inOut', immediateRender: false }, S4 + 1.95);
tl.set('#ponto', { opacity: 0 }, S4 + 2.5);
tl.to('#sinal', { opacity: 0, duration: .35 }, S4 + 2.6);
const TV = S4 + 2.5;
onda(1575, 520, TV, C.laranja, 260);
tl.to('#alerta', { y: 0, opacity: 1, duration: .55, ease: 'back.out(1.8)' }, TV);
tl.fromTo('#cel', { rotation: -3 }, { rotation: 3, duration: .05, ease: 'none', yoyo: true, repeat: 9, immediateRender: false }, TV)
  .set('#cel', { rotation: 0 }, TV + .5);
tl.fromTo(['#vibE', '#vibD'], { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .15, yoyo: true, repeat: 3, immediateRender: false }, TV);
revealIn('#s4 .hora .mask>span', TV + .2, { duration: .45 });
slam('#s4 .hora', TV + .2, 1.3);
// morfose: o alerta do celular vira o cartão do rastreio
const TMF = S5 - .45;
tl.set('#morph', { visibility: 'visible', left: 1410, top: 370, width: 330, height: 200, borderRadius: 34, backgroundColor: C.laranja }, TMF);
tl.to('#morph', { left: 150, top: 520, width: 1120, height: 340, borderRadius: 48, backgroundColor: '#ffffff', duration: .6, ease: 'power4.inOut' }, TMF);
flood(C.creme, TMF + .1, 1575, 470, .55, 'power3.inOut');
tl.to('#s4', { opacity: 0, duration: .3 }, TMF + .05);
hide('#s4', S5 + .2); show('#s5', S5 + .1);
tl.set('#card', { opacity: 1 }, S5 + .15);
tl.set('#morph', { visibility: 'hidden' }, S5 + .2);
tl.set(['#blobA', '#blobB'], { scale: 0 }, S5);

// ============ 5. RASTREIO (13.6 – 18.4) ============
push('#cam5', S5, S6 - S5 - .6);
revealIn('#s5 .lbl .mask>span', S5 + .05);
revealIn('#s5 .tit .mask>span', S5 + .12);
tl.fromTo('#vk5', { opacity: 0, y: 260 }, { opacity: 1, y: 0, ...M.IN, immediateRender: false }, S5 + .3);
const ETAPAS = [S5 + .7, S5 + 1.9, S5 + 3.1];
ETAPAS.forEach((t, i) => {
  const no = `#p${i} .no`;
  tl.to(no, { backgroundColor: C.laranja, color: '#fff', boxShadow: '0 8px 0 #C9561C', duration: .15 }, t);
  tl.fromTo(no, { scale: .7 }, { scale: 1, ...M.SQ, immediateRender: false }, t);
  tl.to(`#p${i} b`, { color: '#C9561C', duration: .15 }, t);
  tl.fromTo(`#p${i} .anel`, { scale: .85, opacity: .9 }, { scale: 1.4, opacity: 0, duration: .9, ease: 'power2.out', repeat: 1, immediateRender: false }, t + .05);
  if (i > 0) {
    const ant = `#p${i - 1}`;
    tl.to(`${ant} .liga i`, { scaleX: 1, duration: .45, ease: 'power2.inOut' }, t - .45);
    tl.to(`${ant} .no`, { backgroundColor: C.ok, boxShadow: '0 8px 0 #22914A', duration: .15 }, t - .12);
    tl.to(`${ant} .ic`, { opacity: 0, duration: .1 }, t - .12);
    tl.to(`${ant} .ck path`, { strokeDashoffset: 0, duration: .35, ease: 'power2.out', autoRound: false }, t - .1);
    tl.to(`${ant} b`, { color: '#22914A', duration: .15 }, t - .12);
    cara('#vk5', i, t + .18);
    pulo('#vk5', t, 55);
  } else piscar('#vk5', t + .3);
});
// Viko pega a bandeja e salta para a próxima cena (crescendo em arco)
const TJ = S6 - .6;
tl.to('#vk5', { x: 170 - 1340, scale: 620 / 470, transformOrigin: '0% 0%', duration: .6, ease: 'power3.inOut' }, TJ);
tl.to('#vk5', { y: -330, duration: .3, ease: 'power2.out' }, TJ).to('#vk5', { y: -130, duration: .3, ease: 'power2.in' }, TJ + .3);
tl.to(['#s5 .lbl', '#s5 .tit', '#card'], { opacity: 0, y: 40, duration: .35, ease: 'power3.in', stagger: .04 }, TJ);
flood(C.amarelo, S6 - .05, 480, 560, .6, 'power3.out');
show('#s6', S6); hide('#s5', S6);

// ============ 6. MARCA (18.4 – 22.3) ============
push('#cam6', S6, S7 - S6 - .4);
tl.fromTo(['#blobA', '#blobB'], { scale: 0 }, { scale: 1, duration: .8, ease: 'expo.out', immediateRender: false }, S6 + .05);
tl.fromTo('#vk6 .corpo', { scaleY: .82, scaleX: 1.12 }, { scaleY: 1, scaleX: 1, ...M.SQ, immediateRender: false }, S6);
onda(480, 820, S6, '#fff', 300, 1);
respirar('#vk6', S6 + .8, 2.6);
piscar('#vk6', S6 + 2.2);
// letras do logo caem uma a uma e quicam
gsap.set('#logo6 .l', { y: -700, opacity: 0 }); gsap.set('#logo6 .fa', { opacity: 0 });
tl.to('#logo6 .l', { y: 0, opacity: 1, duration: .4, ease: 'power2.in', stagger: .07 }, S6 + .25);
tl.fromTo('#logo6 .l', { scaleY: .7, scaleX: 1.22 }, { scaleY: 1, scaleX: 1, ...M.SQ, stagger: .07, immediateRender: false }, S6 + .65);
tl.set('#logo6 .fa', { opacity: 1 }, S6 + 1.15);
faiscas('#logo6 .fa', S6 + 1.15);
revealIn('#s6 .slog1 .mask>span', S6 + 1.6);
revealIn('#s6 .slog2 .mask>span', S6 + 2.2);
tl.fromTo('#s6 .slog2', { scale: 1 }, { scale: 1.06, duration: .18, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, S6 + 2.6);
// o marrom nasce do logo
flood(C.marrom, S7 - .45, 1300, 470, .6, 'power3.inOut');
tl.to(['#vk6', '#s6 .slog1', '#s6 .slog2'], { opacity: 0, duration: .3, ease: 'power3.in' }, S7 - .45);
tl.to('#logo6', { y: -200, scale: .74, opacity: 0, transformOrigin: '50% 0%', duration: .5, ease: 'power3.in' }, S7 - .4);
tl.to(['#blobA', '#blobB'], { scale: 0, duration: .4, ease: 'power3.in' }, S7 - .45);
show('#s7', S7); hide('#s6', S7 + .1);

// ============ 7. CHAMADA (22.3 – 26) ============
push('#cam7', S7, DURATION - S7);
gsap.set('#logo7 .l', { y: -500, opacity: 0 }); gsap.set('#logo7 .fa', { opacity: 0 });
tl.to('#logo7 .l', { y: 0, opacity: 1, duration: .38, ease: 'power2.in', stagger: .05 }, S7 + .05);
tl.fromTo('#logo7 .l', { scaleY: .75, scaleX: 1.18 }, { scaleY: 1, scaleX: 1, ...M.SQ, stagger: .05, immediateRender: false }, S7 + .43);
tl.set('#logo7 .fa', { opacity: 1 }, S7 + .8);
faiscas('#logo7 .fa', S7 + .8);
revealIn('#s7 .lbl .mask>span', S7 + .6);
tl.fromTo('#pill', { opacity: 0, rotationX: -80, y: 80, transformPerspective: 1600, transformOrigin: '50% 0%' },
  { opacity: 1, rotationX: 0, y: 0, transformPerspective: 1600, duration: .8, ease: 'expo.out', immediateRender: false }, S7 + .8);
tl.to('#vk7', { y: 0, duration: .55, ease: 'back.out(1.6)' }, S7 + 1.0);
tl.to('#mao7', { opacity: 1, scale: 1, duration: .35, ease: 'back.out(2.5)' }, S7 + 1.35);
tl.fromTo('#mao7', { rotation: -20, transformOrigin: '50% 95%' }, { rotation: 22, duration: .22, yoyo: true, repeat: 9, ease: 'sine.inOut', immediateRender: false }, S7 + 1.5);
piscar('#vk7', S7 + 1.6);
// o dedo toca "Seguir"
tl.set('#dedo7', { left: 1250, top: 1100, opacity: 1 }, S7);
tl.fromTo('#dedo7', { y: 0, x: 80, rotation: 12 }, { y: -430, x: 0, rotation: 0, duration: .6, ease: 'expo.out', immediateRender: false }, S7 + 1.35);
tl.to('#dedo7', { y: -412, duration: .1, ease: 'power2.in' }, S7 + 2.0);
tl.to('#dedo7 .dedo-ponta', { scaleY: .93, scaleX: 1.04, duration: .1, ease: 'power2.in', yoyo: true, repeat: 1 }, S7 + 2.0);
clique('#dedo7', S7 + 2.0 + .06);
tl.to('#seguir', { scale: .9, duration: .1, ease: 'power2.in' }, S7 + 2.0)
  .to('#seguir', { scale: 1, ...M.SQ }, S7 + 2.1);
onda(1300, 690, S7 + 2.1, C.amarelo, 200);
tl.to('#seguir', { backgroundColor: C.amarelo, color: C.marrom, boxShadow: '0 10px 0 #E3AD12', duration: .15 }, S7 + 2.08);
tl.to('#sg1', { opacity: 0, duration: .1 }, S7 + 2.08).to('#sg2', { opacity: 1, duration: .15 }, S7 + 2.1);
tl.to('#sgck', { strokeDashoffset: 0, duration: .35, ease: 'power2.out', autoRound: false }, S7 + 2.2);
cara('#vk7', 1, S7 + 2.15);
pulo('#vk7', S7 + 2.15, 60);
tl.to('#dedo7', { y: 220, duration: .5, ease: 'power3.in' }, S7 + 2.6);

tl.to({}, { duration: .001 }, DURATION - .001);
window.__timeline = tl;
window.__syncMedia = () => { document.body.classList.add('rendering'); return 0; };

// ================= atualização por frame =================
const pathSinal = $('#sinal'), ponto = $('#ponto'), lenSinal = pathSinal.getTotalLength();
function frame(t) {
  const gf = Math.floor(t * 24);
  $('#grain').style.transform = `translate(${(gf * 97) % 128 - 64}px,${(gf * 53) % 128 - 64}px)`;
  const p = pathSinal.getPointAtLength(sig.p * lenSinal);
  ponto.setAttribute('cx', p.x); ponto.setAttribute('cy', p.y);
  $('#ctrlTime').textContent = t.toFixed(1).padStart(4, '0') + 's';
  $('#ctrlBar i').style.width = (t / DURATION * 100) + '%';
}
tl.pause(0); frame(0);
$('#start').addEventListener('click', () => { document.body.classList.add('started'); tl.play(0); });

// ================= controles no navegador =================
const ctrl = $('#ctrl'); let hideT;
addEventListener('mousemove', () => { ctrl.classList.add('on'); clearTimeout(hideT); hideT = setTimeout(() => ctrl.classList.remove('on'), 2000); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { tl.paused(!tl.paused()); e.preventDefault(); }
  if (e.code === 'ArrowRight') tl.time(Math.min(DURATION - .1, tl.time() + 2));
  if (e.code === 'ArrowLeft') tl.time(Math.max(0, tl.time() - 2));
  if (e.code === 'KeyR') tl.restart();
});
$('#ctrlBar').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); tl.time((e.clientX - r.left) / r.width * DURATION); });
</script>

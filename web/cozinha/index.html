<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcf35">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cozinha</title>
<link rel="stylesheet" href="/comum/base.css">
<link rel="manifest" href="/manifest-cozinha.json">
<link rel="icon" href="/icone.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/cozinha/estilo.css">
</head>
<body>
  <header class="topo-app">
    <div class="ola">
      <div class="ola-viko" id="ola-viko"></div>
      <div>
        <h1>Cozinha</h1>
        <small id="restaurante"></small>
      </div>
    </div>
    <div class="direita">
      <span class="relogio" id="relogio"></span>
      <button id="ativar" class="btn claro">🔔 Ativar som</button>
    </div>
  </header>
  <p id="aviso-alerta" class="aviso-alerta"></p>

  <main class="colunas">
    <section class="coluna novos">
      <h2 class="secao">Novos <span class="n" id="n-novos"></span></h2>
      <div class="lista" id="novos"></div>
    </section>
    <section class="coluna fogo">
      <h2 class="secao">No fogo <span class="n" id="n-fogo"></span></h2>
      <div class="lista" id="preparando"></div>
    </section>
    <section class="coluna saindo">
      <h2 class="secao">Esperando o garçom <span class="n" id="n-prontos"></span></h2>
      <div class="lista" id="prontos"></div>
    </section>
  </main>

<script src="/vendor/supabase.js"></script>
<script type="module" src="/cozinha/app.js"></script>
</body>
</html>

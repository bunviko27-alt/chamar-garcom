<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mesa</title>
<link rel="stylesheet" href="/base.css">
<link rel="icon" href="/icone.svg">
<style>
  html, body { height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; font-size: 4vmin; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3.5vmin 5vmin 0; color: var(--suave); font-size: 1em; font-weight: 600;
  }
  header .mesa { color: var(--texto); background: var(--cartao); box-shadow: var(--sombra);
    padding: 1vmin 3vmin; border-radius: 999px; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3vmin 5vmin; }
  .tela { display: none; flex-direction: column; align-items: center; text-align: center; gap: 3vmin; width: 100%; }
  body[data-tela="inicio"] #inicio,
  body[data-tela="chamando"] #chamando,
  body[data-tela="pedido"] #pedido { display: flex; }

  /* Botão principal */
  .botao {
    width: 52vmin; height: 52vmin; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff7a4d, var(--marca) 55%, var(--marca-escura));
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5vmin; box-shadow: 0 2vmin 5vmin rgba(232, 87, 42, .35), inset 0 -1vmin 2vmin rgba(0,0,0,.12);
    transition: transform .12s;
    will-change: transform;          /* toque não repinta a sombra */
  }
  .botao:active { transform: scale(.94); }
  .botao svg { width: 17vmin; height: 17vmin; }
  .botao span { font-size: 1.25em; font-weight: 800; line-height: 1.1; }
  .dica { color: var(--suave); font-size: .9em; }

  /* Chamando */
  .anel { position: relative; width: 40vmin; height: 40vmin; display: grid; place-items: center; }
  .anel::before, .anel::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--marca); opacity: .25; animation: pulso 2.4s ease-out infinite;
    will-change: transform, opacity;
  }
  .anel::after { animation-delay: 1.2s; }
  .anel .miolo { position: relative; width: 26vmin; height: 26vmin; border-radius: 50%;
    background: var(--marca); display: grid; place-items: center; color: #fff; }
  .anel .miolo svg { width: 13vmin; height: 13vmin; animation: balanca 1.6s ease-in-out infinite; will-change: transform; }
  @keyframes pulso { from { transform: scale(.6); opacity: .45; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes balanca { 0%,100% { transform: rotate(0); } 25% { transform: rotate(14deg); } 75% { transform: rotate(-14deg); } }

  h1 { margin: 0; font-size: 1.7em; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .sub { margin: 0; color: var(--suave); font-size: 1.05em; min-height: 1.3em; transition: opacity .4s; }
  .link { background: none; color: var(--suave); text-decoration: underline; font-size: .85em; padding: 1vmin; }

  /* Pedido */
  .icone { font-size: 18vmin; line-height: 1; will-change: transform; }
  [data-status="enviado"] .icone { animation: desliza 1.6s ease-in-out infinite; }
  [data-status="preparando"] .icone { animation: mexe 1s ease-in-out infinite; }
  [data-status="pronto"] .icone { animation: pula .9s ease-in-out infinite; }
  [data-status="entregue"] .icone { animation: none; }
  @keyframes desliza { 0%,100% { transform: translateX(-2vmin); } 50% { transform: translateX(2vmin); } }
  @keyframes mexe { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-1vmin); } }
  @keyframes pula { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3vmin); } }

  .etapas { display: flex; gap: 2vmin; width: min(100%, 90vmin); margin-top: 1vmin; }
  .etapa { flex: 1; display: flex; flex-direction: column; gap: 1.2vmin; font-size: .7em;
    color: var(--suave); font-weight: 600; }
  .etapa i { height: 1.4vmin; border-radius: 99px; background: var(--linha); overflow: hidden; position: relative; contain: strict; }
  .etapa.feita { color: var(--texto); }
  .etapa.feita i { background: var(--ok); }
  .etapa.atual { color: var(--texto); }
  .etapa.atual i::after { content: ""; position: absolute; inset: 0; width: 40%;
    background: var(--marca); border-radius: 99px; animation: carrega 1.6s ease-in-out infinite;
    will-change: transform; }
  @keyframes carrega { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  footer { display: none; justify-content: center; padding: 0 5vmin 4vmin; }
  body[data-tela="pedido"] footer { display: flex; }
  .mini {
    display: flex; align-items: center; gap: 2vmin; background: var(--cartao); box-shadow: var(--sombra);
    color: var(--texto); padding: 2.2vmin 4.5vmin; border-radius: 999px; font-size: .95em; font-weight: 700;
  }
  .mini svg { width: 5vmin; height: 5vmin; color: var(--marca); }
  .mini.avisado { color: var(--ok); }
  .mini.avisado svg { color: var(--ok); }

  /* Só transform/opacity são animados (feitos pela GPU, sem repintar a tela).
     Tela inicial parada = processador livre. ?leve=1 desliga as animações contínuas. */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  .leve *, .leve *::before, .leve *::after { animation: none !important; }
</style>
</head>
<body data-tela="inicio">
  <header><span id="restaurante"></span><span class="mesa" id="nome-mesa"></span></header>

  <main>
    <section class="tela" id="inicio">
      <button class="botao" id="chamar" aria-label="Chamar garçom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8V6"/><path d="M10 6h4"/></svg>
        <span>Chamar<br>garçom</span>
      </button>
      <p class="dica">Toque no botão e alguém vem até a sua mesa</p>
    </section>

    <section class="tela" id="chamando">
      <div class="anel"><div class="miolo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8V6"/><path d="M10 6h4"/></svg>
      </div></div>
      <h1>Garçom avisado!</h1>
      <p class="sub">Já está vindo até você</p>
      <button class="link" id="cancelar">Chamei sem querer</button>
    </section>

    <section class="tela" id="pedido">
      <div class="icone" id="p-icone"></div>
      <h1 id="p-titulo"></h1>
      <p class="sub" id="p-sub"></p>
      <div class="etapas" id="p-etapas">
        <div class="etapa"><i></i>Anotado</div>
        <div class="etapa"><i></i>Na cozinha</div>
        <div class="etapa"><i></i>A caminho</div>
      </div>
    </section>
  </main>

  <footer>
    <button class="mini" id="chamar-mini">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8V6"/><path d="M10 6h4"/></svg>
      <span>Chamar garçom</span>
    </button>
  </footer>

<script src="/vendor/supabase.js"></script>
<script type="module">
  import { iniciar, acaoMesa, agoraServidor } from "/comum.js";

  const PARAMS = new URLSearchParams(location.search);
  const MESA = location.pathname.split("/")[2] || PARAMS.get("n") || "1";
  if (PARAMS.get("leve") === "1") document.documentElement.classList.add("leve");
  const MOSTRAR_ENTREGUE = 20; // segundos que "Bom apetite!" fica na tela

  const FRASES = {
    enviado: { icone: "📝", etapa: 0, titulos: ["Pedido anotado!"],
      subs: ["Já está indo para a cozinha", "Anotadinho! Já já começa a mágica", "Seu pedido está a caminho do chef"] },
    preparando: { icone: "👨‍🍳", etapa: 1,
      titulos: ["O chef está caprichando", "Panelas no fogo!", "Preparando com carinho"],
      subs: ["Um cheirinho bom já está no ar…", "Temperando cada detalhe", "Feito na hora, só pra você", "Falta pouco, segura a fome!"] },
    pronto: { icone: "🍽️", etapa: 2, titulos: ["Saindo da cozinha!"],
      subs: ["Seu pedido está a caminho da mesa", "Prepare o garfo!", "Chegando quentinho"] },
    entregue: { icone: "😋", etapa: 3, titulos: ["Bom apetite!"],
      subs: ["Qualquer coisa, é só chamar", "Aproveite!"] },
  };

  const $ = (id) => document.getElementById(id);
  $("nome-mesa").textContent = `Mesa ${MESA}`;
  document.title = `Mesa ${MESA}`;

  let ultimo = null, giro = 0, statusAtual = null;

  function pedidoDaMesa(estado) {
    const meus = estado.pedidos.filter((p) => p.mesa === MESA);
    const ativos = meus.filter((p) => p.status !== "entregue");
    if (ativos.length) return ativos[ativos.length - 1];
    const ent = meus.filter((p) => agoraServidor() - p.atualizado < MOSTRAR_ENTREGUE);
    return ent[ent.length - 1] || null;
  }

  function desenhar() {
    if (!ultimo) return;
    $("restaurante").textContent = ultimo.config.restaurante;
    const chamando = MESA in ultimo.chamados;
    const pedido = pedidoDaMesa(ultimo);

    if (pedido) {
      document.body.dataset.tela = "pedido";
      const f = FRASES[pedido.status];
      if (pedido.status !== statusAtual) { statusAtual = pedido.status; giro = 0; }
      $("pedido").dataset.status = pedido.status;
      $("p-icone").textContent = f.icone;
      $("p-titulo").textContent = f.titulos[giro % f.titulos.length];
      $("p-sub").textContent = f.subs[giro % f.subs.length];
      [...$("p-etapas").children].forEach((el, i) => {
        el.className = "etapa" + (i < f.etapa ? " feita" : i === f.etapa ? " atual" : "");
      });
      const mini = $("chamar-mini");
      mini.classList.toggle("avisado", chamando);
      mini.querySelector("span").textContent = chamando ? "Garçom avisado ✓" : "Chamar garçom";
    } else {
      statusAtual = null;
      document.body.dataset.tela = chamando ? "chamando" : "inicio";
    }
  }

  // Troca as frases a cada 6 s e reavalia o "Bom apetite!" que expira.
  setInterval(() => {
    giro++;
    $("p-sub").style.opacity = 0;
    setTimeout(() => { desenhar(); $("p-sub").style.opacity = 1; }, 400);
  }, 6000);

  $("chamar").onclick = () => acaoMesa(MESA, "chamar");
  $("chamar-mini").onclick = () => { if (!(MESA in (ultimo?.chamados || {}))) acaoMesa(MESA, "chamar"); };
  $("cancelar").onclick = () => acaoMesa(MESA, "cancelar");
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  iniciar({ papel: "mesa", mesa: MESA, aoReceber: (estado) => { ultimo = estado; desenhar(); } });
</script>
</body>
</html>

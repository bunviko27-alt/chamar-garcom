<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mesa</title>
<link rel="stylesheet" href="/comum/base.css">
<link rel="icon" href="/icone.svg">
<link rel="stylesheet" href="/mesa/estilo.css">
</head>
<body data-tela="inicio">
  <!-- Manchas de fundo (fixas: desenhadas uma vez só) -->
  <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div>

  <header>
    <div class="logo">bunviko<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M8 13 L11 3 M17 18 L26 10 M19 26 L29 26" stroke="#EF7130" stroke-width="5" stroke-linecap="round"/></svg></div>
    <span class="mesa-num" id="nome-mesa"></span>
  </header>

  <main>
    <div class="texto">
      <!-- Início -->
      <section class="estado" data-para="inicio">
        <h1>Oi, eu sou<br>o Viko!</h1>
        <p class="sub">Um toque e o garçom vem até você.</p>
        <button class="btn-grande" id="chamar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8V6"/><path d="M10 6h4"/></svg>
          Chamar garçom
        </button>
      </section>

      <!-- Chamando -->
      <section class="estado" data-para="chamando">
        <h1>Já avisei<br>o garçom!</h1>
        <p class="sub">Ele está vindo até a sua mesa.</p>
        <button class="link" id="cancelar">Chamei sem querer</button>
      </section>

      <!-- Pedido em andamento -->
      <section class="estado" data-para="pedido">
        <h1 id="p-titulo"></h1>
        <p class="sub" id="p-sub"></p>
        <div class="progresso">
          <div class="barra"><i id="p-barra"></i></div>
          <ol class="etapas" id="p-etapas">
            <li>Anotado</li><li>Na cozinha</li><li>A caminho</li>
          </ol>
        </div>
      </section>
    </div>

    <div class="personagem" id="personagem"></div>
  </main>

  <footer>
    <button class="btn-mini" id="chamar-mini">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8V6"/><path d="M10 6h4"/></svg>
      <span>Chamar garçom</span>
    </button>
  </footer>

<script src="/vendor/supabase.js"></script>
<script type="module" src="/mesa/app.js"></script>
</body>
</html>
